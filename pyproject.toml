[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomography"
version = "0.1.0"
description = "Bayesian linear travel-time tomography: a controlled numerical study of reconstruction and uncertainty calibration."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tomography"]

[tool.pytest.ini_options]
testpaths = ["tests"]
